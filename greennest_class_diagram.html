
<div id="cls" style="padding: 8px 0"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});

const diagram = `classDiagram
  class User {
    +int user_id
    +String name
    +String email
    +String mobile
    +register()
    +login()
    +getPlantCards()
  }

  class Plant {
    +int plant_id
    +String name
    +Decimal price
    +int stock
    +JSON tags
    +getDetails()
    +isAvailable()
    +matchTags(answers)
  }

  class Order {
    +int order_id
    +Decimal total
    +String status
    +Date order_date
    +placeOrder()
    +cancelOrder()
    +getItems()
  }

  class OrderItem {
    +int quantity
    +Decimal price
    +getSubtotal()
  }

  class Gift {
    +String recipient_name
    +String recipient_mobile
    +String message
    +Date delivery_date
    +Boolean gift_wrap
    +send()
  }

  class PlantCard {
    +String nickname
    +String species
    +String location
    +String light_exposure
    +Date date_added
    +updateCare()
    +getHealthLog()
    +linkReminders()
  }

  class HealthLog {
    +String entry_type
    +String diagnosis
    +Decimal confidence
    +String photo_url
    +Date created_at
    +addEntry()
  }

  class DiagnosisEngine {
    +matchSymptoms(tags)
    +scoreRules(symptoms, context)
    +getTopDiagnosis()
    +getAlternates()
  }

  class DiagnosisRule {
    +String cause
    +JSON symptom_tags
    +JSON context_tags
    +Decimal confidence_base
  }

  class RecommendationEngine {
    +filterPlants(answers)
    +scorePlants(plants, answers)
    +getTopN(n)
  }

  User "1" --> "0..*" Order : places
  User "1" --> "0..*" Gift : sends
  User "1" --> "0..*" PlantCard : owns
  Order "1" --> "1..*" OrderItem : contains
  OrderItem "0..*" --> "1" Plant : references
  Gift "0..*" --> "1" Plant : includes
  PlantCard "1" --> "0..*" HealthLog : logs
  DiagnosisEngine ..> DiagnosisRule : uses
  DiagnosisEngine ..> HealthLog : writes
  RecommendationEngine ..> Plant : queries
`;

const { svg } = await mermaid.render('cls-svg', diagram);
document.getElementById('cls').innerHTML = svg;
</script>
