
<div id="erd" style="padding: 8px 0"></div>
<style>
#erd svg { max-width: 100%; }
</style>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});

const diagram = `erDiagram
  USERS {
    int user_id PK
    string name
    string email
    string mobile
    string address
    date created_at
  }

  PLANTS {
    int plant_id PK
    string name
    string category
    text description
    decimal price
    int stock
    string sunlight
    string water_frequency
    string image_url
    json purpose
    json location
    json light
    json season
    string maintenance
    json gift_for
    json occasion
  }

  ORDERS {
    int order_id PK
    int user_id FK
    decimal total_amount
    string status
    date order_date
  }

  ORDER_ITEMS {
    int order_item_id PK
    int order_id FK
    int plant_id FK
    int quantity
    decimal price
  }

  GIFTS {
    int gift_id PK
    int sender_id FK
    string recipient_name
    string recipient_mobile
    text recipient_address
    int plant_id FK
    text message
    date delivery_date
    string status
    boolean gift_wrap
  }

  WISHLIST {
    int wishlist_id PK
    int user_id FK
    int plant_id FK
    date added_at
  }

  PLANT_CARDS {
    int plant_card_id PK
    int user_id FK
    string nickname
    string species
    string photo_url
    string location
    string light_exposure
    date date_added
    string water_frequency
    string fertilize_frequency
  }

  HEALTH_LOGS {
    int log_id PK
    int plant_card_id FK
    string entry_type
    string diagnosis
    decimal confidence
    string photo_url
    date created_at
  }

  DIAGNOSIS_RULES {
    int rule_id PK
    string cause
    json symptom_tags
    json context_tags
    decimal confidence_base
  }

  RECOMMENDATION_SESSIONS {
    int session_id PK
    int user_id FK
    string flow_type
    json answers
    date created_at
  }

  USERS ||--o{ ORDERS : "places"
  USERS ||--o{ GIFTS : "sends"
  USERS ||--o{ WISHLIST : "saves"
  USERS ||--o{ PLANT_CARDS : "owns"
  USERS ||--o{ RECOMMENDATION_SESSIONS : "starts"
  ORDERS ||--o{ ORDER_ITEMS : "contains"
  ORDER_ITEMS }o--|| PLANTS : "references"
  GIFTS }o--|| PLANTS : "includes"
  WISHLIST }o--|| PLANTS : "holds"
  PLANT_CARDS ||--o{ HEALTH_LOGS : "tracks"
`;

const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
